# Deploys Firestore/Storage rules, indexes and Cloud Functions on every push to main.
# The website itself is deployed by Firebase App Hosting, which watches this repo.
# Needs two repository secrets: FIREBASE_SERVICE_ACCOUNT (JSON key) and FIREBASE_PROJECT_ID.
name: Firebase backend

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "FIREBASE_SERVICE_ACCOUNT is not set; skipping."; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install functions dependencies
        if: steps.check.outputs.ready == 'true'
        run: npm install --prefix functions

      - name: Deploy rules, indexes and functions
        if: steps.check.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore,storage,functions --project "$PROJECT" --non-interactive --force
